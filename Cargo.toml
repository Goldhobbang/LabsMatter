[workspace]
resolver = "2"
members = [
    "crates/realmatter-core",
    "crates/realmatter-tpt",
    "crates/realmatter-world",
    "crates/realmatter-physics",
    "crates/realmatter-chemistry",
    "crates/realmatter-renderer",
    "crates/realmatter-ui",
    "crates/realmatter-persist",
    "crates/realmatter-wasm",
    "crates/labsmatter-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["REALMATTER Contributors"]
repository = "https://example.invalid/realmatter"

[workspace.dependencies]
glam = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
wgpu = "22"
bincode = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Size-first release profile (previous default). Kept for comparison; the
# measured simulation throughput is markedly lower than `release` (speed),
# so `release` is the shipping configuration.
[profile.release-z]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.release-s]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1